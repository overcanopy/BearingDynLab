[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bearingdyn"
version = "0.1.0"
description = "Research-code platform for roller bearing dynamics simulation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "BearingDynLab contributors"}
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
